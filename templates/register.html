{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-center">Register New User</h2>
<form method="POST" class="card p-4 mx-auto">
    <div class="mb-3">
        <label for="username" class="form-label text-light fs-5">Username</label>
        <input id="username" type="text" name="username" placeholder="Enter your username" class="form-control form-control-lg text-light bg-dark" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label text-light fs-5">Email</label>
        <input id="email" type="email" name="email" placeholder="Enter your email" class="form-control form-control-lg text-light bg-dark" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label text-light fs-5">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter your password" class="form-control form-control-lg text-light bg-dark" required>
    </div>
    <button class="btn btn-success btn-lg w-100" type="submit">Register</button>
    <p class="mt-3 text-center"><a href="{{ url_for('login') }}">Already have an account? Login</a></p>
</form>
{% endblock %}
