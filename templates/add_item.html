{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-center"><i class="bi bi-plus-square me-2"></i>Add Lost or Found Item</h2>
<form method="POST" enctype="multipart/form-data" class="card p-4 mx-auto">
    <div class="mb-3">
        <label for="title" class="form-label text-light fs-5">Item Title</label>
        <input id="title" type="text" name="title" placeholder="Enter the item lost or found" class="form-control form-control-lg text-light bg-dark" required />
    </div>
    <div class="mb-3">
        <label for="description" class="form-label text-light fs-5">Description</label>
        <textarea id="description" name="description" placeholder="Enter detailed description" class="form-control form-control-lg text-light bg-dark" rows="4"></textarea>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label text-light fs-5">Status</label>
        <select id="status" name="status" class="form-select form-select-lg text-light bg-dark" required>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="image" class="form-label text-light fs-5">Upload an Image (optional)</label>
        <input id="image" type="file" class="form-control form-control-lg text-light" name="image" accept="image/*">
    </div>
    <button type="submit" class="btn btn-success btn-lg w-100">Add Item</button>
</form>
{% endblock %}
